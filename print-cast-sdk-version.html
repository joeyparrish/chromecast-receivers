<html lang="en">
  <head>
    <title>Print Cast SDK Version</title>
    <link rel="stylesheet" type="text/css" href="common.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400..700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <script src="start-session.js"></script>
    <style>

body {
  text-align: left;
  font-size: 3vh;
}

h1 {
  font-size: 3vh;
  display: inline-block;
  vertical-align: top;
  margin: 0;
}

div {
  margin-bottom: 3vh;
}

tt {
  display: inline-block;
  white-space: pre;

  font-family: "Kode Mono", monospace;
  font-optical-sizing: auto;
  font-weight: 400;
  font-style: normal;
}

#errorMessage {
  color: #bb0000;
  font-weight: bold;
}

    </style>
  </head>
  <body>
    <div>
      <h1>Cast SDK version:</h1>
      <tt id="sdkVersionOutput"></tt>
    </div>
    <div>
      <h1>Device serial number:</h1>
      <tt id="deviceSerialOutput"></tt>
    </div>
    <div>
      <h1>User Agent string:</h1>
      <tt id="userAgentOutput"></tt>
    </div>
    <div>
      <h1>Device metadata:</h1>
      <tt id="metadataOutput"></tt>
    </div>
    <div>
      <h1>Device probe:</h1>
      <tt id="probeOutput"></tt>
    </div>
    <div id="errorMessage">
    </div>
  </body>
  <script>

async function main() {
  // The NATO phonetic alphabet, for clarity of similar-sounding letters.
  const phonetic = {
    'A': 'alpha',
    'B': 'bravo',
    'C': 'Charlie',
    'D': 'delta',
    'E': 'echo',
    'F': 'foxtrot',
    'G': 'golf',
    'H': 'hotel',
    'I': 'India',
    'J': 'Juliet',
    'K': 'kilo',
    'L': 'Lima',
    'M': 'Mike',
    'N': 'November',
    'O': 'Oscar',
    'P': 'papa',
    'Q': 'Quebec',
    'R': 'Romeo',
    'S': 'Sierra',
    'T': 'tango',
    'U': 'uniform',
    'V': 'Victor',
    'W': 'whiskey',
    'X': 'x-ray',
    'Y': 'yankee',
    'Z': 'Zulu',
  };

  const params = new URLSearchParams(location.search);
  const deviceSerial = params.get('serial') || '';

  const sdkVersion = window.cast ? cast.framework.VERSION : 0;

  const context = cast.framework.CastReceiverContext.getInstance();
  const metadata = context.getDeviceInformation();
  const deviceCapabilities = context.getDeviceCapabilities() || {};

  let maxH264Level = 0;
  if (MediaSource.isTypeSupported('video/mp4; codecs="avc1.640028"')) {
    maxH264Level = 4.0;
  }
  if (MediaSource.isTypeSupported('video/mp4; codecs="avc1.640029"')) {
    maxH264Level = 4.1;
  }
  if (MediaSource.isTypeSupported('video/mp4; codecs="avc1.64002a"')) {
    maxH264Level = 4.2;
  }
  if (MediaSource.isTypeSupported('video/mp4; codecs="avc1.640032"')) {
    maxH264Level = 5.0;
  }
  if (MediaSource.isTypeSupported('video/mp4; codecs="avc1.640033"')) {
    maxH264Level = 5.1;
  }
  if (MediaSource.isTypeSupported('video/mp4; codecs="avc1.640034"')) {
    maxH264Level = 5.2;
  }

  // Assumes a flat object
  function briefJSON(obj) {
    // Serialize
    return JSON.stringify(obj, null, 2)
        // Split into lines
        .split('\n')
        // Drop first and last line ("{" and "}")
        .slice(1, -1)
        // Combine with newlines again
        .join('\n');
  }

  const probe = {
    memory: (navigator.deviceMemory || 0) + ' GB',
    cores: navigator.hardwareConcurrency || 0,
    'display-supported': deviceCapabilities['display_supported'] || true,
    'cast-lite': deviceCapabilities['cast_lite_only'] || false,
    'max-h264-level': maxH264Level,
    'hevc-supported': MediaSource.isTypeSupported('video/mp4; codecs="hev1.1.6.L150.B0"'),
    'hevc-10-bit-supported': MediaSource.isTypeSupported('video/mp4; codecs="hev1.2.6.L150.B0"'),
  };

  deviceSerialOutput.textContent = deviceSerial;
  sdkVersionOutput.textContent = sdkVersion;
  userAgentOutput.textContent = navigator.userAgent.replace(/\) /g, ')\n');
  metadataOutput.textContent = briefJSON(metadata);
  probeOutput.textContent = briefJSON(probe);
  errorMessage.textContent = '';

  if (window.speechSynthesis) {
    console.log('Speech synthesis API available.');

    window.say = function(sentence, rate) {
      console.log('Saying: ' + sentence);

      return new Promise((resolve, reject) => {
        const utterance = new SpeechSynthesisUtterance(sentence);
        utterance.lang = 'en';
        utterance.rate = rate;
        utterance.onend = resolve;
        utterance.onerror = reject;
        speechSynthesis.speak(utterance);
      });
    };
  } else {
    console.log('Speech synthesis API unavailable.');

    window.say = function(sentence, rate) {
      // Stub until we have a fallback option that works.
    };
  }

  function pause(seconds) {
    return new Promise(resolve => setTimeout(resolve, seconds * 1000));
  }

  async function announce(fastPart, slowParts) {
    await say(fastPart, 1.0);
    await pause(1.0);

    for (const slowPart of slowParts) {
      // Pad these each to the same duration.
      const targetDuration = 1.1;

      const start = Date.now();
      await say(slowPart, 0.5);
      const end = Date.now();
      const duration = (end - start) / 1000;

      await pause(targetDuration - duration);
    }

    await pause(1.0);
  }

  function alphaNumericParts(input) {
    return input.split('')
        .map(x => {
          if (/[A-Za-z]/.exec(x)) {
            return phonetic[x.toUpperCase()];
          } else {
            return x;
          }
        });
  }

  function valueToSpeech(value) {
    if (value === null) {
      return 'null';
    } else if (value === undefined) {
      return 'undefined';
    } else if (value === '') {
      return 'empty string';
    } else {
      return value.toString();
    }
  }

  function jsonParts(obj) {
    const parts = [];
    for (const key in obj) {
      const value = obj[key];
      const spokenKey = key
          .replace(/\bos\b/, 'O.S.')
          .replace(/\bid\b/, 'I.D.')
          .replace(/\bhevc\b/, 'H.E.V.C.')
          .replace(/\bh264\b/, 'H 2 6 4')
          .replace(/-/g, ' ');
      const spokenValue = valueToSpeech(value);
      if (key == 'device-id') {
        parts.push(spokenKey + ':');
        parts.push(...alphaNumericParts(value));
      } else {
        parts.push(spokenKey + ': ' + spokenValue + '.');
      }
    }
    return parts;
  }

  try {
    const deviceSerialParts = alphaNumericParts(deviceSerial);
    const sdkVersionParts = sdkVersion.split('')
        .map(x => x == '.' ? 'point' : x);
    const metadataParts = jsonParts(metadata);
    const probeParts = jsonParts(probe);

    const deviceSerialAnnouncement = 'The device serial number is:';
    const sdkVersionAnnouncement = 'The Cast SDK version number is:';
    const metadataAnnouncement = 'The device metadata is:';

    async function announceEverything() {
      await announce(sdkVersionAnnouncement, sdkVersionParts);
      await announce(deviceSerialAnnouncement, deviceSerialParts);
      await announce(metadataAnnouncement, metadataParts.concat(probeParts));
      await pause(3.0);
    }
    window.announceEverything = announceEverything;  // For debugging

    await announceEverything();
    await say('Message repeats.', 1.0);
    await pause(1.0);
    await announceEverything();
    if (cast.__platform__ && window.speechSynthesis) {
      window.close();
    }
  } catch (error) {
    // On Cast, it's fine to synthesize speech on page load.
    // On Chrome, you need user interaction.  To debug, allow clicking the
    // document to start this process.
    errorMessage.textContent = 'Speech failure.  Click document to play sound.';
    document.addEventListener('click', main, {once: true});
  }
}

main();
  </script>
</html>
